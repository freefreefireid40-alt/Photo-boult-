<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=6, minimum-scale=1, user-scalable=yes, viewport-fit=cover">
<title>ফটো ভল্ট</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#b8860b; --gold2:#d4af37; --ink:#111318; --muted:#6b7280;
    --danger:#dc2626; --ok:#16a34a; --line:#ececec;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{min-height:100%; margin:0;}
  body{
    font-family:'Hind Siliguri','Poppins',-apple-system,sans-serif;
    background:#fdfdfd; color:var(--ink);
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  #matrix{ position:fixed; inset:0; z-index:0; }
  .wrap{ position:relative; z-index:1; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card{
    background:#ffffff; border:1px solid var(--line); border-radius:22px;
    padding:34px 26px; width:100%; max-width:400px;
    box-shadow:0 25px 60px rgba(17,19,24,0.08), 0 2px 8px rgba(17,19,24,0.04);
  }
  .card.plain{ box-shadow:0 10px 30px rgba(0,0,0,0.06); }
  h1{
    font-family:'Poppins',sans-serif; font-size:22px; margin:0 0 6px; text-align:center;
    color:var(--ink); font-weight:800; letter-spacing:0.3px;
  }
  p.sub{ font-size:13.5px; text-align:center; margin:0 0 22px; color:var(--muted); font-weight:500; }
  input{
    width:100%; padding:14px 16px; border-radius:14px; border:1.5px solid var(--line);
    background:#fafafa; color:var(--ink); font-size:16px; margin-bottom:11px;
    font-family:'Hind Siliguri',sans-serif; transition:border-color .15s;
  }
  input:focus{ outline:none; border-color:var(--gold2); background:#fff; }
  input[type="password"]{ -webkit-text-security:disc; text-security:disc; letter-spacing:4px; font-size:19px; }
  input::placeholder{ color:#a1a1aa; letter-spacing:normal; font-size:15px; }
  button{
    width:100%; padding:14px; border-radius:14px; border:none; cursor:pointer;
    background:linear-gradient(135deg,#1a1a1a,#333); color:#fff; font-size:15.5px; font-weight:700;
    margin-top:4px; font-family:'Poppins',sans-serif; letter-spacing:0.3px;
    box-shadow:0 10px 24px rgba(0,0,0,0.18);
  }
  button.secondary{ background:transparent; box-shadow:none; color:var(--gold); font-weight:600; }
  button.danger{ background:var(--danger); box-shadow:none; }
  button.ghost{ background:#f3f4f6; box-shadow:none; color:#333; }
  .msg{ font-size:13.5px; text-align:center; margin-top:11px; min-height:16px; font-weight:600; }
  .msg.err{ color:var(--danger); } .msg.ok{ color:var(--ok); }
  .back{ font-size:13px; color:var(--muted); text-align:center; margin-top:16px; cursor:pointer; text-decoration:underline; }
  .folder-row{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    border:1px solid var(--line); border-radius:14px; padding:13px 15px; margin-bottom:8px;
  }
  .folder-row .name{ font-size:14.5px; font-weight:700; flex:1; }
  .folder-row .acts{ display:flex; gap:6px; }
  .folder-row .acts button{ width:auto; padding:7px 11px; font-size:12px; margin:0; box-shadow:none; }
  .folder-btn{
    width:100%; text-align:left; padding:15px 17px; border-radius:14px; border:1.5px solid var(--line);
    background:#fafafa; color:var(--ink); font-size:15px; margin-bottom:8px; cursor:pointer; font-weight:700;
    font-family:'Hind Siliguri',sans-serif;
  }
  #homeBtn{
    position:fixed; top:14px; left:14px; z-index:9999; display:none;
    background:#1a1a1a; color:#fff; border:none; border-radius:20px;
    padding:9px 16px; font-size:13px; font-weight:700; box-shadow:0 4px 14px rgba(0,0,0,0.2);
    font-family:'Poppins',sans-serif;
  }
  #cornerAdminLink{ position:fixed; bottom:10px; right:14px; z-index:9998; font-size:13px; color:#d4d4d8; cursor:pointer; padding:10px; user-select:none; }
</style>
</head>
<body>

<canvas id="matrix"></canvas>
<div class="wrap"><div class="card" id="app"><div style="text-align:center;">লোড হচ্ছে...</div></div></div>
<div id="cornerAdminLink">·</div>
<button id="homeBtn">← মূল পেজে ফিরুন</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, doc, getDoc, getDocs, setDoc, deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBOkwwmcpI-iyg0A4jqZMISWYLBWdZYUxk",
  authDomain: "photo-boult.firebaseapp.com",
  projectId: "photo-boult",
  storageBucket: "photo-boult.firebasestorage.app",
  messagingSenderId: "331515261814",
  appId: "1:331515261814:web:d6465ba76ebebe0acc8057"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);

async function sha256(text){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

const app = document.getElementById("app");
const wrap = document.querySelector(".wrap");
const matrixCanvas = document.getElementById("matrix");
const homeBtn = document.getElementById("homeBtn");
const adminLink = document.getElementById("cornerAdminLink");

function enterAdminMode(){
  document.body.style.background = "#f6f6f7";
  matrixCanvas.style.display = "none";
  adminLink.style.display = "none";
  homeBtn.style.display = "block";
  app.classList.add("plain");
}
function exitAdminMode(){
  document.body.style.background = "#fdfdfd";
  matrixCanvas.style.display = "block";
  adminLink.style.display = "block";
  homeBtn.style.display = "none";
  app.classList.remove("plain");
}
homeBtn.onclick = () => { exitAdminMode(); renderMain(); };
adminLink.onclick = renderAdminLogin;

/* ---------- মূল পেজ ---------- */
function renderMain(msg){
  app.innerHTML = `
    <h1>ফটো ভল্ট</h1>
    <p class="sub">পাসওয়ার্ড দিয়ে ফোল্ডার দেখুন</p>
    <input id="pwInput" type="password" placeholder="পাসওয়ার্ড লিখুন">
    <button id="openBtn">ওপেন করুন</button>
    <div class="msg ${msg && msg.type==='err' ? 'err':'ok'}">${msg ? msg.text : ''}</div>
    <button class="secondary" id="browseBtn" style="margin-top:10px;">ফোল্ডার তালিকা থেকে খুঁজুন</button>
  `;
  document.getElementById("openBtn").onclick = tryOpenFolder;
  document.getElementById("pwInput").addEventListener("keydown", e=>{ if(e.key==="Enter") tryOpenFolder(); });
  document.getElementById("browseBtn").onclick = renderFolderBrowse;
}

async function tryOpenFolder(){
  const pw = document.getElementById("pwInput").value.trim();
  if(!pw) return;
  try{
    const hash = await sha256(pw);
    const snap = await getDocs(collection(db, "folders"));
    for(const d of snap.docs){
      const f = d.data();
      if(f.passHash === hash){
        renderMain({type:'ok', text:'তোর পাসওয়ার্ডটি সঠিক হয়েছে! এখনই দেখাচ্ছি তোর ফটোগুলো...'});
        window.location.href = f.link;
        return;
      }
    }
    renderMain({type:'err', text:'কিরে, তুই কি চোর নাকি? ভুল পাসওয়ার্ড দিলি! সঠিকটা দে।'});
  }catch(e){
    renderMain({type:'err', text:'সমস্যা হয়েছে, আবার চেষ্টা করুন।'});
  }
}

async function renderFolderBrowse(){
  app.innerHTML = `
    <h1>ফোল্ডার তালিকা</h1>
    <p class="sub">কাঙ্ক্ষিত ফোল্ডারে ক্লিক করুন</p>
    <div id="browseList"><p class="sub">লোড হচ্ছে...</p></div>
    <div class="back" id="browseBack">মূল পেজে ফিরে যান</div>
  `;
  document.getElementById("browseBack").onclick = renderMain;
  const listEl = document.getElementById("browseList");
  try{
    const snap = await getDocs(collection(db, "folders"));
    if(snap.empty){ listEl.innerHTML = `<p class="sub">কোনো ফোল্ডার নেই।</p>`; return; }
    listEl.innerHTML = "";
    snap.forEach(d=>{
      const f = d.data();
      const btn = document.createElement("button");
      btn.className = "folder-btn";
      btn.textContent = f.label || d.id;
      btn.onclick = () => renderFolderPasswordScreen(f);
      listEl.appendChild(btn);
    });
  }catch(e){ listEl.innerHTML = `<p class="sub">লোড করা যায়নি।</p>`; }
}

function renderFolderPasswordScreen(f){
  app.innerHTML = `
    <h1>${f.label}</h1>
    <p class="sub">এই ফোল্ডারের পাসওয়ার্ড দিন</p>
    <input id="fpwInput" type="password" placeholder="পাসওয়ার্ড লিখুন">
    <button id="fpwOpenBtn">ওপেন করুন</button>
    <div class="msg err" id="fpwMsg"></div>
    ${f.hint ? `<button class="secondary" id="hintBtn" style="margin-top:8px;">পাসওয়ার্ড না জানলে হিন্ট দেখ</button><div class="msg ok" id="hintText" style="display:none;"></div>` : ''}
    <div class="back" id="fpwBack">ফোল্ডার তালিকায় ফিরে যান</div>
  `;
  document.getElementById("fpwBack").onclick = renderFolderBrowse;
  const tryIt = async () => {
    const pw = document.getElementById("fpwInput").value.trim();
    const msgEl = document.getElementById("fpwMsg");
    if(!pw) return;
    const hash = await sha256(pw);
    if(hash === f.passHash){
      msgEl.className = "msg ok"; msgEl.textContent = "তোর পাসওয়ার্ডটি সঠিক হয়েছে! এখনই দেখাচ্ছি তোর ফটোগুলো...";
      window.location.href = f.link;
    }else{
      msgEl.className = "msg err"; msgEl.textContent = "কিরে, তুই কি চোর নাকি? ভুল পাসওয়ার্ড দিলি! সঠিকটা দে।";
    }
  };
  document.getElementById("fpwOpenBtn").onclick = tryIt;
  document.getElementById("fpwInput").addEventListener("keydown", e=>{ if(e.key==="Enter") tryIt(); });
  if(f.hint){
    document.getElementById("hintBtn").onclick = () => {
      const h = document.getElementById("hintText");
      h.style.display = "block"; h.textContent = f.hint;
    };
  }
}

/* ---------- এডমিন লগইন ---------- */
function renderAdminLogin(){
  enterAdminMode();
  app.innerHTML = `
    <h1>মালিকের পাসওয়ার্ড</h1>
    <p class="sub">শুধু মালিকের জন্য</p>
    <input id="adminPw" type="password" placeholder="মালিকের পাসওয়ার্ড">
    <button id="adminGoBtn">প্রবেশ করুন</button>
    <div class="msg err" id="adminMsg"></div>
    <div class="back" id="backBtn">মূল পেজে ফিরে যান</div>
  `;
  document.getElementById("backBtn").onclick = () => { exitAdminMode(); renderMain(); };
  document.getElementById("adminGoBtn").onclick = adminLogin;
  document.getElementById("adminPw").addEventListener("keydown", e=>{ if(e.key==="Enter") adminLogin(); });
}

async function adminLogin(){
  const pw = document.getElementById("adminPw").value.trim();
  const msgEl = document.getElementById("adminMsg");
  if(!pw) return;
  try{
    const hash = await sha256(pw);
    const ref = doc(db, "admin", "config");
    const snap = await getDoc(ref);
    if(!snap.exists() || !snap.data().passHash){
      await setDoc(ref, { passHash: hash });
      renderAdminDashboard();
    }else if(snap.data().passHash === hash){
      renderAdminDashboard();
    }else{
      msgEl.textContent = "এটা মালিকের পাসওয়ার্ড না, আবার চেষ্টা কর।";
    }
  }catch(e){ msgEl.textContent = "সমস্যা হয়েছে, আবার চেষ্টা করুন।"; }
}

/* ---------- এডমিন ড্যাশবোর্ড ---------- */
async function renderAdminDashboard(){
  app.innerHTML = `
    <h1>এডমিন প্যানেল</h1>
    <p class="sub">সব ফোল্ডার</p>
    <div id="folderList"><p class="sub">লোড হচ্ছে...</p></div>
    <button id="addNewBtn">+ নতুন ফোল্ডার যোগ করুন</button>
    <button class="ghost" id="changeAdminPwBtn" style="margin-top:10px;">এডমিন পাসওয়ার্ড পরিবর্তন করুন</button>
  `;
  document.getElementById("addNewBtn").onclick = renderAddFolderScreen;
  document.getElementById("changeAdminPwBtn").onclick = renderChangeAdminPassword;
  loadFolderList();
}

async function loadFolderList(){
  const listEl = document.getElementById("folderList");
  try{
    const snap = await getDocs(collection(db, "folders"));
    if(snap.empty){ listEl.innerHTML = `<p class="sub">কোনো ফোল্ডার নেই।</p>`; return; }
    listEl.innerHTML = "";
    snap.forEach(d=>{
      const f = d.data();
      const row = document.createElement("div");
      row.className = "folder-row";
      row.innerHTML = `<div class="name">${f.label || d.id}</div>
        <div class="acts">
          <button class="ghost" data-act="edit">এডিট</button>
          <button class="danger" data-act="del">মুছুন</button>
        </div>`;
      row.querySelector("[data-act='edit']").onclick = () => renderEditFolderScreen(d.id, f);
      row.querySelector("[data-act='del']").onclick = async () => {
        if(confirm(`"${f.label}" ফোল্ডারটি মুছে ফেলতে চান?`)){
          await deleteDoc(doc(db, "folders", d.id));
          loadFolderList();
        }
      };
      listEl.appendChild(row);
    });
  }catch(e){ listEl.innerHTML = `<p class="sub">লোড করা যায়নি।</p>`; }
}

/* ---------- নতুন ফোল্ডার যোগ করুন (আলাদা স্ক্রিন) ---------- */
function renderAddFolderScreen(){
  app.innerHTML = `
    <h1>নতুন ফোল্ডার</h1>
    <p class="sub">নাম, পাসওয়ার্ড ও লিংক দিন</p>
    <input id="fLabel" placeholder="নাম (যেমন: রাহিমের ছবি)">
    <input id="fPw" placeholder="পাসওয়ার্ড">
    <input id="fLink" placeholder="ব্লগার লিংক">
    <input id="fHint" placeholder="হিন্ট (ঐচ্ছিক)">
    <button id="saveNewBtn">সেভ করুন</button>
    <div class="msg" id="newMsg"></div>
    <div class="back" id="cancelNewBtn">বাতিল করুন</div>
  `;
  document.getElementById("cancelNewBtn").onclick = renderAdminDashboard;
  document.getElementById("saveNewBtn").onclick = async () => {
    const label = document.getElementById("fLabel").value.trim();
    const pw = document.getElementById("fPw").value.trim();
    const link = document.getElementById("fLink").value.trim();
    const hint = document.getElementById("fHint").value.trim();
    const msgEl = document.getElementById("newMsg");
    if(!label || !pw || !link){ msgEl.className="msg err"; msgEl.textContent="সবগুলো ঘর পূরণ করুন।"; return; }
    try{
      const passHash = await sha256(pw);
      const slug = "f" + Date.now();
      await setDoc(doc(db, "folders", slug), { label, passHash, link, hint });
      renderAdminDashboard();
    }catch(e){ msgEl.className="msg err"; msgEl.textContent="সেভ করা যায়নি।"; }
  };
}

/* ---------- ফোল্ডার এডিট (আলাদা স্ক্রিন) ---------- */
function renderEditFolderScreen(folderId, f){
  app.innerHTML = `
    <h1>এডিট করুন</h1>
    <p class="sub">${f.label}</p>
    <input id="eLabel" value="${f.label || ''}" placeholder="নাম">
    <input id="ePw" placeholder="নতুন পাসওয়ার্ড (খালি রাখলে আগেরটাই থাকবে)">
    <input id="eLink" value="${f.link || ''}" placeholder="ব্লগার লিংক">
    <input id="eHint" value="${f.hint || ''}" placeholder="হিন্ট (ঐচ্ছিক)">
    <button id="saveEditBtn">সেভ করুন</button>
    <div class="msg" id="editMsg"></div>
    <div class="back" id="cancelEditBtn">বাতিল করুন</div>
  `;
  document.getElementById("cancelEditBtn").onclick = renderAdminDashboard;
  document.getElementById("saveEditBtn").onclick = async () => {
    const label = document.getElementById("eLabel").value.trim();
    const link = document.getElementById("eLink").value.trim();
    const hint = document.getElementById("eHint").value.trim();
    const newPw = document.getElementById("ePw").value.trim();
    const msgEl = document.getElementById("editMsg");
    try{
      const passHash = newPw ? await sha256(newPw) : f.passHash;
      await setDoc(doc(db, "folders", folderId), { label, link, hint, passHash });
      renderAdminDashboard();
    }catch(e){ msgEl.className="msg err"; msgEl.textContent="সেভ করা যায়নি।"; }
  };
}

/* ---------- এডমিন পাসওয়ার্ড পরিবর্তন ---------- */
function renderChangeAdminPassword(){
  app.innerHTML = `
    <h1>এডমিন পাসওয়ার্ড পরিবর্তন</h1>
    <p class="sub">নতুন এডমিন পাসওয়ার্ড দিন</p>
    <input id="newAdminPw" type="password" placeholder="নতুন পাসওয়ার্ড">
    <input id="confirmAdminPw" type="password" placeholder="আবার লিখুন">
    <button id="saveAdminPwBtn">সেভ করুন</button>
    <div class="msg" id="adminPwMsg"></div>
    <div class="back" id="cancelAdminPwBtn">বাতিল করুন</div>
  `;
  document.getElementById("cancelAdminPwBtn").onclick = renderAdminDashboard;
  document.getElementById("saveAdminPwBtn").onclick = async () => {
    const p1 = document.getElementById("newAdminPw").value.trim();
    const p2 = document.getElementById("confirmAdminPw").value.trim();
    const msgEl = document.getElementById("adminPwMsg");
    if(!p1 || p1 !== p2){ msgEl.className="msg err"; msgEl.textContent="দুটো পাসওয়ার্ড মিলছে না।"; return; }
    try{
      const passHash = await sha256(p1);
      await setDoc(doc(db, "admin", "config"), { passHash });
      msgEl.className="msg ok"; msgEl.textContent="এডমিন পাসওয়ার্ড বদলানো হয়েছে!";
      setTimeout(renderAdminDashboard, 800);
    }catch(e){ msgEl.className="msg err"; msgEl.textContent="সেভ করা যায়নি।"; }
  };
}

renderMain();

/* ---- ম্যাট্রিক্স ব্যাকগ্রাউন্ড ---- */
(function(){
  const canvas = matrixCanvas;
  const ctx = canvas.getContext("2d");
  let w, h, cols, drops;
  const chars = "01アイウエオカキクケコ".split("");
  function resize(){
    w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight;
    cols = Math.floor(w / 18); drops = new Array(cols).fill(1);
  }
  window.addEventListener("resize", resize); resize();
  function draw(){
    ctx.fillStyle = "rgba(253,253,253,0.12)"; ctx.fillRect(0,0,w,h);
    ctx.fillStyle = "rgba(184,134,11,0.18)"; ctx.font = "14px monospace";
    for(let i=0;i<drops.length;i++){
      ctx.fillText(chars[Math.floor(Math.random()*chars.length)], i*18, drops[i]*18);
      if(drops[i]*18 > h && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }
  setInterval(draw, 60);
})();
</script>
</body>
</html>
