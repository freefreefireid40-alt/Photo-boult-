<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ফটো ভল্ট</title>
<style>
  :root{
    --card:rgba(10,14,20,0.82); --text:#eafff1; --muted:#7ee8a6;
    --accent:#00ff9d; --accent-text:#031b10; --border:rgba(0,255,157,0.35); --danger:#ff5d5d;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:#02060a; color:var(--text); overflow:hidden;
    font-family:'Courier New',monospace;
  }
  #matrix{ position:fixed; inset:0; z-index:0; display:block; }
  .wrap{
    position:relative; z-index:1; min-height:100%;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:18px;
    padding:30px 26px; width:100%; max-width:380px;
    backdrop-filter:blur(6px); box-shadow:0 0 30px rgba(0,255,157,0.15);
  }
  h1{
    font-size:20px; margin:0 0 6px; text-align:center; letter-spacing:2px;
    color:var(--accent); text-shadow:0 0 10px rgba(0,255,157,0.6);
  }
  p.sub{color:var(--muted); font-size:13px; text-align:center; margin:0 0 22px; opacity:0.85;}
  input{
    width:100%; padding:13px 14px; border-radius:10px; border:1px solid var(--border);
    background:rgba(0,0,0,0.4); color:var(--accent); font-size:16px; margin-bottom:12px;
    font-family:'Courier New',monospace; letter-spacing:1px;
  }
  input::placeholder{color:rgba(126,232,166,0.5);}
  input:focus{outline:none; box-shadow:0 0 0 2px var(--accent);}
  button{
    width:100%; padding:13px; border-radius:10px; border:none;
    background:var(--accent); color:var(--accent-text); font-size:15px; font-weight:700;
    cursor:pointer; margin-top:4px; letter-spacing:1px;
    box-shadow:0 0 15px rgba(0,255,157,0.4);
  }
  button.secondary{
    background:transparent; color:var(--muted); font-weight:500; font-size:12px;
    padding:6px; box-shadow:none; margin-top:0; text-decoration:underline;
  }
  .msg{font-size:13px; text-align:center; margin-top:12px; min-height:18px;}
  .msg.err{color:var(--danger);}
  .msg.ok{color:var(--accent);}
  .row{display:flex; justify-content:flex-end; margin-top:18px;}
  .folder-item{
    display:flex; justify-content:space-between; align-items:center;
    border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:8px;
  }
  .folder-item div{font-size:14px;}
  .folder-item .del{background:transparent; color:var(--danger); width:auto; padding:4px 10px; margin:0; font-size:13px; box-shadow:none;}
  hr{border:none; border-top:1px solid var(--border); margin:18px 0;}
  .back{font-size:13px; color:var(--muted); text-align:center; margin-top:16px; cursor:pointer; text-decoration:underline;}

  /* ---- এডমিন মোড: সাদাসিধা, নরমাল ---- */
  body.admin-mode{ background:#f2f3f5; }
  .card.plain{
    background:#ffffff; border:1px solid #e2e4e8; box-shadow:0 2px 14px rgba(0,0,0,0.08);
    backdrop-filter:none;
  }
  .card.plain h1{ color:#1a1a1a; text-shadow:none; font-family:-apple-system,sans-serif; }
  .card.plain p.sub{ color:#777; }
  .card.plain input{
    background:#f7f7f8; color:#1a1a1a; font-family:-apple-system,sans-serif; letter-spacing:normal;
  }
  .card.plain input::placeholder{ color:#999; }
  .card.plain button{
    background:#2563eb; color:#fff; box-shadow:none; font-family:-apple-system,sans-serif;
  }
  .card.plain button.secondary, .card.plain .back{ color:#2563eb; text-shadow:none; }
  .card.plain .folder-item{ border-color:#e2e4e8; }
  #homeBtn{
    position:fixed; top:14px; left:14px; z-index:9999; display:none;
    background:#2563eb; color:#fff; border:none; border-radius:20px;
    padding:8px 16px; font-size:13px; font-weight:600; cursor:pointer;
    font-family:-apple-system,sans-serif; box-shadow:0 2px 8px rgba(0,0,0,0.15);
  }
</style>
</head>
<body>

<canvas id="matrix"></canvas>
<div class="wrap">
  <div class="card" id="app">
    <div style="text-align:center;">লোড হচ্ছে...</div>
  </div>
</div>
<div id="cornerAdminLink" style="position:fixed; z-index:9999; pointer-events:auto; font-size:13px; color:rgba(0,255,157,0.55); text-shadow:0 0 6px rgba(0,255,157,0.5); font-family:'Courier New',monospace; cursor:pointer; padding:10px; user-select:none;">admin</div>
<button id="homeBtn">← মূল পেজে ফিরুন</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, doc, getDoc, getDocs, setDoc, deleteDoc, query, where, limit
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBOkwwmcpI-iyg0A4jqZMISWYLBWdZYUxk",
  authDomain: "photo-boult.firebaseapp.com",
  projectId: "photo-boult",
  storageBucket: "photo-boult.firebasestorage.app",
  messagingSenderId: "331515261814",
  appId: "1:331515261814:web:d6465ba76ebebe0acc8057"
};

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);

async function sha256(text){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

const app = document.getElementById("app");

function renderMain(msg){
  app.innerHTML = `
    <h1>ফটো ভল্ট</h1>
    <p class="sub">পাসওয়ার্ড দিয়ে ফোল্ডার দেখুন</p>
    <input id="pwInput" type="password" placeholder="পাসওয়ার্ড লিখুন" autocomplete="off">
    <button id="openBtn">ওপেন করুন</button>
    <div class="msg ${msg && msg.type==='err' ? 'err':'ok'}">${msg ? msg.text : ''}</div>
    <div id="linkArea"></div>
    <button class="secondary" id="browseBtn" style="margin-top:14px;">ফোল্ডার তালিকা থেকে খুঁজুন</button>
  `;
  document.getElementById("openBtn").onclick = tryOpenFolder;
  document.getElementById("pwInput").addEventListener("keydown", e=>{ if(e.key==="Enter") tryOpenFolder(); });
  document.getElementById("browseBtn").onclick = renderFolderBrowse;
}

async function renderFolderBrowse(){
  app.innerHTML = `
    <h1>ফোল্ডার তালিকা</h1>
    <p class="sub">কাঙ্ক্ষিত ফোল্ডারে ক্লিক করুন</p>
    <div id="browseList"><p class="sub">লোড হচ্ছে...</p></div>
    <div class="back" id="browseBack">মূল পেজে ফিরে যান</div>
  `;
  document.getElementById("browseBack").onclick = () => renderMain();
  const listEl = document.getElementById("browseList");
  try{
    const snap = await getDocs(collection(db, "folders"));
    if(snap.empty){
      listEl.innerHTML = `<p class="sub">কোনো ফোল্ডার নেই।</p>`;
      return;
    }
    listEl.innerHTML = "";
    snap.forEach(d=>{
      const f = d.data();
      const btn = document.createElement("button");
      btn.textContent = f.label || d.id;
      btn.style.marginBottom = "8px";
      btn.onclick = () => renderFolderPasswordScreen(d.id, f);
      listEl.appendChild(btn);
    });
  }catch(e){
    listEl.innerHTML = `<p class="sub">লোড করা যায়নি।</p>`;
  }
}

function renderFolderPasswordScreen(folderId, f){
  app.innerHTML = `
    <h1>${f.label || folderId}</h1>
    <p class="sub">এই ফোল্ডারের পাসওয়ার্ড দিন</p>
    <input id="fpwInput" type="password" placeholder="পাসওয়ার্ড লিখুন" autocomplete="off">
    <button id="fpwOpenBtn">ওপেন করুন</button>
    <div class="msg err" id="fpwMsg"></div>
    ${f.hint ? `<button class="secondary" id="hintBtn" style="margin-top:10px;">হিন্ট দেখুন</button><div class="msg ok" id="hintText" style="display:none;"></div>` : ''}
    <div class="back" id="fpwBack">ফোল্ডার তালিকায় ফিরে যান</div>
  `;
  document.getElementById("fpwBack").onclick = renderFolderBrowse;
  const tryIt = async () => {
    const pw = document.getElementById("fpwInput").value.trim();
    const msgEl = document.getElementById("fpwMsg");
    if(!pw) return;
    try{
      const hash = await sha256(pw);
      if(hash === f.passHash){
        msgEl.className = "msg ok"; msgEl.textContent = "সঠিক পাসওয়ার্ড! নিয়ে যাওয়া হচ্ছে...";
        window.location.href = f.link;
      }else{
        msgEl.className = "msg err"; msgEl.textContent = "পাসওয়ার্ড মেলেনি।";
      }
    }catch(e){
      msgEl.className = "msg err"; msgEl.textContent = "সমস্যা হয়েছে।";
    }
  };
  document.getElementById("fpwOpenBtn").onclick = tryIt;
  document.getElementById("fpwInput").addEventListener("keydown", e=>{ if(e.key==="Enter") tryIt(); });
  if(f.hint){
    document.getElementById("hintBtn").onclick = () => {
      const h = document.getElementById("hintText");
      h.style.display = "block";
      h.textContent = f.hint;
    };
  }
}
const matrixCanvas = document.getElementById("matrix");
const homeBtn = document.getElementById("homeBtn");
function enterAdminMode(){
  document.body.classList.add("admin-mode");
  matrixCanvas.style.display = "none";
  document.getElementById("cornerAdminLink").style.display = "none";
  homeBtn.style.display = "block";
  app.classList.add("plain");
}
function exitAdminMode(){
  document.body.classList.remove("admin-mode");
  matrixCanvas.style.display = "block";
  document.getElementById("cornerAdminLink").style.display = "block";
  homeBtn.style.display = "none";
  app.classList.remove("plain");
}
homeBtn.onclick = () => { exitAdminMode(); renderMain(); };

const adminLink = document.getElementById("cornerAdminLink");
adminLink.addEventListener("click", (e) => { e.preventDefault(); renderAdminLogin(); });
adminLink.addEventListener("touchend", (e) => { e.preventDefault(); renderAdminLogin(); });

function moveAdminLink(){
  const margin = 20;
  const w = window.innerWidth, h = window.innerHeight;
  const x = margin + Math.random() * (w - margin*2 - 50);
  const y = margin + Math.random() * (h - margin*2 - 30);
  adminLink.style.left = x + "px";
  adminLink.style.top = y + "px";
}
moveAdminLink();
setInterval(moveAdminLink, 4000);

async function tryOpenFolder(){
  const pw = document.getElementById("pwInput").value.trim();
  if(!pw) return;
  try{
    const hash = await sha256(pw);
    const q = query(collection(db, "folders"), where("passHash","==",hash), limit(1));
    const snap = await getDocs(q);
    if(!snap.empty){
      const f = snap.docs[0].data();
      renderMain({type:'ok', text:'সঠিক পাসওয়ার্ড! নিয়ে যাওয়া হচ্ছে...'});
      window.location.href = f.link;
    }else{
      renderMain({type:'err', text:'পাসওয়ার্ড মেলেনি।'});
    }
  }catch(e){
    renderMain({type:'err', text:'সমস্যা হয়েছে, আবার চেষ্টা করুন।'});
  }
}

function renderAdminLogin(){
  enterAdminMode();
  app.innerHTML = `
    <h1>এডমিন লগইন</h1>
    <p class="sub">এডমিন পাসওয়ার্ড দিন (প্রথমবার হলে নতুন পাসওয়ার্ড সেট হবে)</p>
    <input id="adminPw" type="password" placeholder="এডমিন পাসওয়ার্ড">
    <button id="adminGoBtn">প্রবেশ করুন</button>
    <div class="msg err" id="adminMsg"></div>
    <div class="back" id="backBtn">ফিরে যান</div>
  `;
  document.getElementById("backBtn").onclick = () => { exitAdminMode(); renderMain(); };
  document.getElementById("adminGoBtn").onclick = adminLogin;
  document.getElementById("adminPw").addEventListener("keydown", e=>{ if(e.key==="Enter") adminLogin(); });
}

async function adminLogin(){
  const pw = document.getElementById("adminPw").value.trim();
  const msgEl = document.getElementById("adminMsg");
  if(!pw) return;
  try{
    const hash = await sha256(pw);
    const ref = doc(db, "admin", "config");
    const snap = await getDoc(ref);
    if(!snap.exists() || !snap.data().passHash){
      await setDoc(ref, { passHash: hash });
      renderAdminPanel();
    }else if(snap.data().passHash === hash){
      renderAdminPanel();
    }else{
      msgEl.textContent = "ভুল পাসওয়ার্ড।";
    }
  }catch(e){
    msgEl.textContent = "সমস্যা হয়েছে, আবার চেষ্টা করুন।";
  }
}

function renderAdminPanel(){
  app.innerHTML = `
    <h1>এডমিন প্যানেল</h1>
    <div id="folderList"><p class="sub">লোড হচ্ছে...</p></div>
    <hr>
    <p class="sub" style="margin-bottom:8px;">নতুন ফোল্ডার যোগ করুন</p>
    <input id="newLabel" placeholder="নাম (যেমন: রাহিমের ছবি)">
    <input id="newPw" placeholder="পাসওয়ার্ড">
    <input id="newLink" placeholder="ব্লগার লিংক">
    <input id="newHint" placeholder="হিন্ট (ঐচ্ছিক)">
    <button id="addBtn">যোগ করুন</button>
    <div class="msg" id="addMsg"></div>
    <div class="back" id="backBtn2">মূল পেজে ফিরে যান</div>
  `;
  document.getElementById("backBtn2").onclick = () => { exitAdminMode(); renderMain(); };
  document.getElementById("addBtn").onclick = addFolder;
  loadFolderList();
}

async function loadFolderList(){
  const listEl = document.getElementById("folderList");
  try{
    const snap = await getDocs(collection(db, "folders"));
    if(snap.empty){
      listEl.innerHTML = `<p class="sub">কোনো ফোল্ডার নেই।</p>`;
      return;
    }
    listEl.innerHTML = "";
    snap.forEach(d=>{
      const f = d.data();
      const row = document.createElement("div");
      row.className = "folder-item";
      row.innerHTML = `<div>${f.label || d.id}</div>
        <div>
          <button class="del" data-id="${d.id}" data-act="edit" style="color:var(--accent);">এডিট</button>
          <button class="del" data-id="${d.id}" data-act="del">মুছুন</button>
        </div>`;
      listEl.appendChild(row);
    });
    listEl.querySelectorAll("[data-act='del']").forEach(btn=>{
      btn.onclick = async ()=>{
        try{ await deleteDoc(doc(db, "folders", btn.dataset.id)); loadFolderList(); }catch(e){}
      };
    });
    listEl.querySelectorAll("[data-act='edit']").forEach(btn=>{
      btn.onclick = () => openEditForm(btn.dataset.id);
    });
  }catch(e){
    listEl.innerHTML = `<p class="sub">ফোল্ডার লোড করা যায়নি।</p>`;
  }
}

async function openEditForm(folderId){
  const listEl = document.getElementById("folderList");
  try{
    const snap = await getDoc(doc(db, "folders", folderId));
    if(!snap.exists()) return;
    const f = snap.data();
    listEl.innerHTML = `
      <p class="sub" style="margin-bottom:8px;">এডিট করুন: ${f.label || folderId}</p>
      <input id="editLabel" value="${f.label || ''}" placeholder="নাম">
      <input id="editPw" placeholder="নতুন পাসওয়ার্ড (খালি রাখলে আগেরটাই থাকবে)">
      <input id="editLink" value="${f.link || ''}" placeholder="ব্লগার লিংক">
      <input id="editHint" value="${f.hint || ''}" placeholder="হিন্ট (ঐচ্ছিক)">
      <button id="saveEditBtn">সেভ করুন</button>
      <div class="msg" id="editMsg"></div>
      <div class="back" id="cancelEditBtn">বাতিল করুন</div>
    `;
    document.getElementById("cancelEditBtn").onclick = loadFolderList;
    document.getElementById("saveEditBtn").onclick = async () => {
      const msgEl = document.getElementById("editMsg");
      const label = document.getElementById("editLabel").value.trim();
      const link = document.getElementById("editLink").value.trim();
      const hint = document.getElementById("editHint").value.trim();
      const newPw = document.getElementById("editPw").value.trim();
      try{
        const update = { label, link, hint, passHash: f.passHash };
        if(newPw){ update.passHash = await sha256(newPw); }
        await setDoc(doc(db, "folders", folderId), update);
        msgEl.className = "msg ok"; msgEl.textContent = "সেভ হয়েছে!";
        setTimeout(loadFolderList, 600);
      }catch(e){
        msgEl.className = "msg err"; msgEl.textContent = "সেভ করা যায়নি।";
      }
    };
  }catch(e){}
}

async function addFolder(){
  const label = document.getElementById("newLabel").value.trim();
  const pw = document.getElementById("newPw").value.trim();
  const link = document.getElementById("newLink").value.trim();
  const hint = document.getElementById("newHint").value.trim();
  const msgEl = document.getElementById("addMsg");
  if(!label || !pw || !link){ msgEl.className="msg err"; msgEl.textContent="সবগুলো ঘর পূরণ করুন।"; return; }
  try{
    const hash = await sha256(pw);
    const slug = "f" + Date.now();
    await setDoc(doc(db, "folders", slug), { label, passHash: hash, link, hint });
    msgEl.className="msg ok"; msgEl.textContent="যোগ হয়েছে!";
    document.getElementById("newLabel").value="";
    document.getElementById("newPw").value="";
    document.getElementById("newLink").value="";
    document.getElementById("newHint").value="";
    loadFolderList();
  }catch(e){
    msgEl.className="msg err"; msgEl.textContent="যোগ করা যায়নি।";
  }
}

renderMain();

// ---- ম্যাট্রিক্স ব্যাকগ্রাউন্ড অ্যানিমেশন ----
(function(){
  const canvas = document.getElementById("matrix");
  const ctx = canvas.getContext("2d");
  let w, h, cols, drops;
  const chars = "01アイウエオカキクケコサシスセソタチツテト".split("");

  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    cols = Math.floor(w / 16);
    drops = new Array(cols).fill(1);
  }
  window.addEventListener("resize", resize);
  resize();

  function draw(){
    ctx.fillStyle = "rgba(2,6,10,0.08)";
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = "#00ff9d";
    ctx.font = "14px monospace";
    for(let i=0; i<drops.length; i++){
      const text = chars[Math.floor(Math.random()*chars.length)];
      ctx.fillText(text, i*16, drops[i]*16);
      if(drops[i]*16 > h && Math.random() > 0.975){ drops[i] = 0; }
      drops[i]++;
    }
  }
  setInterval(draw, 50);
})();
</script>
</body>
</html>
