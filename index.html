<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ফটো ভল্ট</title>
<style>
  :root{
    --card:rgba(10,14,20,0.82); --text:#eafff1; --muted:#7ee8a6;
    --accent:#00ff9d; --accent-text:#031b10; --border:rgba(0,255,157,0.35); --danger:#ff5d5d;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:#02060a; color:var(--text); overflow:hidden;
    font-family:'Courier New',monospace;
  }
  #matrix{ position:fixed; inset:0; z-index:0; display:block; }
  .wrap{
    position:relative; z-index:1; min-height:100%;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:18px;
    padding:30px 26px; width:100%; max-width:380px;
    backdrop-filter:blur(6px); box-shadow:0 0 30px rgba(0,255,157,0.15);
  }
  h1{
    font-size:20px; margin:0 0 6px; text-align:center; letter-spacing:2px;
    color:var(--accent); text-shadow:0 0 10px rgba(0,255,157,0.6);
  }
  p.sub{color:var(--muted); font-size:13px; text-align:center; margin:0 0 22px; opacity:0.85;}
  input{
    width:100%; padding:13px 14px; border-radius:10px; border:1px solid var(--border);
    background:rgba(0,0,0,0.4); color:var(--accent); font-size:16px; margin-bottom:12px;
    font-family:'Courier New',monospace; letter-spacing:1px;
  }
  input::placeholder{color:rgba(126,232,166,0.5);}
  input:focus{outline:none; box-shadow:0 0 0 2px var(--accent);}
  button{
    width:100%; padding:13px; border-radius:10px; border:none;
    background:var(--accent); color:var(--accent-text); font-size:15px; font-weight:700;
    cursor:pointer; margin-top:4px; letter-spacing:1px;
    box-shadow:0 0 15px rgba(0,255,157,0.4);
  }
  button.secondary{
    background:transparent; color:var(--muted); font-weight:500; font-size:12px;
    padding:6px; box-shadow:none; margin-top:0; text-decoration:underline;
  }
  .msg{font-size:13px; text-align:center; margin-top:12px; min-height:18px;}
  .msg.err{color:var(--danger);}
  .msg.ok{color:var(--accent);}
  .row{display:flex; justify-content:flex-end; margin-top:18px;}
  .folder-item{
    display:flex; justify-content:space-between; align-items:center;
    border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:8px;
  }
  .folder-item div{font-size:14px;}
  .folder-item .del{background:transparent; color:var(--danger); width:auto; padding:4px 10px; margin:0; font-size:13px; box-shadow:none;}
  hr{border:none; border-top:1px solid var(--border); margin:18px 0;}
  .back{font-size:13px; color:var(--muted); text-align:center; margin-top:16px; cursor:pointer; text-decoration:underline;}
</style>
</head>
<body>

<canvas id="matrix"></canvas>
<div class="wrap">
  <div class="card" id="app">
    <div style="text-align:center;">লোড হচ্ছে...</div>
  </div>
</div>
<div id="cornerAdminLink" style="position:fixed; z-index:9999; pointer-events:auto; font-size:13px; color:rgba(0,255,157,0.55); text-shadow:0 0 6px rgba(0,255,157,0.5); font-family:'Courier New',monospace; cursor:pointer; padding:10px; user-select:none;">admin</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, doc, getDoc, getDocs, setDoc, deleteDoc, query, where, limit
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBOkwwmcpI-iyg0A4jqZMISWYLBWdZYUxk",
  authDomain: "photo-boult.firebaseapp.com",
  projectId: "photo-boult",
  storageBucket: "photo-boult.firebasestorage.app",
  messagingSenderId: "331515261814",
  appId: "1:331515261814:web:d6465ba76ebebe0acc8057"
};

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);

async function sha256(text){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

const app = document.getElementById("app");

function renderMain(msg){
  app.innerHTML = `
    <h1>ফটো ভল্ট</h1>
    <p class="sub">পাসওয়ার্ড দিয়ে ফোল্ডার দেখুন</p>
    <input id="pwInput" type="password" placeholder="পাসওয়ার্ড লিখুন" autocomplete="off">
    <button id="openBtn">ওপেন করুন</button>
    <div class="msg ${msg && msg.type==='err' ? 'err':'ok'}">${msg ? msg.text : ''}</div>
    <div id="linkArea"></div>
  `;
  document.getElementById("openBtn").onclick = tryOpenFolder;
  document.getElementById("pwInput").addEventListener("keydown", e=>{ if(e.key==="Enter") tryOpenFolder(); });
}
const adminLink = document.getElementById("cornerAdminLink");
adminLink.addEventListener("click", (e) => { e.preventDefault(); renderAdminLogin(); });
adminLink.addEventListener("touchend", (e) => { e.preventDefault(); renderAdminLogin(); });

function moveAdminLink(){
  const margin = 20;
  const w = window.innerWidth, h = window.innerHeight;
  const x = margin + Math.random() * (w - margin*2 - 50);
  const y = margin + Math.random() * (h - margin*2 - 30);
  adminLink.style.left = x + "px";
  adminLink.style.top = y + "px";
}
moveAdminLink();
setInterval(moveAdminLink, 4000);

async function tryOpenFolder(){
  const pw = document.getElementById("pwInput").value.trim();
  if(!pw) return;
  try{
    const hash = await sha256(pw);
    const q = query(collection(db, "folders"), where("passHash","==",hash), limit(1));
    const snap = await getDocs(q);
    if(!snap.empty){
      const f = snap.docs[0].data();
      renderMain({type:'ok', text:'সঠিক পাসওয়ার্ড! নিয়ে যাওয়া হচ্ছে...'});
      window.location.href = f.link;
    }else{
      renderMain({type:'err', text:'পাসওয়ার্ড মেলেনি।'});
    }
  }catch(e){
    renderMain({type:'err', text:'সমস্যা হয়েছে, আবার চেষ্টা করুন।'});
  }
}

function renderAdminLogin(){
  app.innerHTML = `
    <h1>এডমিন লগইন</h1>
    <p class="sub">এডমিন পাসওয়ার্ড দিন (প্রথমবার হলে নতুন পাসওয়ার্ড সেট হবে)</p>
    <input id="adminPw" type="password" placeholder="এডমিন পাসওয়ার্ড">
    <button id="adminGoBtn">প্রবেশ করুন</button>
    <div class="msg err" id="adminMsg"></div>
    <div class="back" id="backBtn">ফিরে যান</div>
  `;
  document.getElementById("backBtn").onclick = () => renderMain();
  document.getElementById("adminGoBtn").onclick = adminLogin;
  document.getElementById("adminPw").addEventListener("keydown", e=>{ if(e.key==="Enter") adminLogin(); });
}

async function adminLogin(){
  const pw = document.getElementById("adminPw").value.trim();
  const msgEl = document.getElementById("adminMsg");
  if(!pw) return;
  try{
    const hash = await sha256(pw);
    const ref = doc(db, "admin", "config");
    const snap = await getDoc(ref);
    if(!snap.exists() || !snap.data().passHash){
      await setDoc(ref, { passHash: hash });
      renderAdminPanel();
    }else if(snap.data().passHash === hash){
      renderAdminPanel();
    }else{
      msgEl.textContent = "ভুল পাসওয়ার্ড।";
    }
  }catch(e){
    msgEl.textContent = "সমস্যা হয়েছে, আবার চেষ্টা করুন।";
  }
}

function renderAdminPanel(){
  app.innerHTML = `
    <h1>এডমিন প্যানেল</h1>
    <div id="folderList"><p class="sub">লোড হচ্ছে...</p></div>
    <hr>
    <p class="sub" style="margin-bottom:8px;">নতুন ফোল্ডার যোগ করুন</p>
    <input id="newLabel" placeholder="নাম (যেমন: রাহিমের ছবি)">
    <input id="newPw" placeholder="পাসওয়ার্ড">
    <input id="newLink" placeholder="ব্লগার লিংক">
    <button id="addBtn">যোগ করুন</button>
    <div class="msg" id="addMsg"></div>
    <div class="back" id="backBtn2">মূল পেজে ফিরে যান</div>
  `;
  document.getElementById("backBtn2").onclick = () => renderMain();
  document.getElementById("addBtn").onclick = addFolder;
  loadFolderList();
}

async function loadFolderList(){
  const listEl = document.getElementById("folderList");
  try{
    const snap = await getDocs(collection(db, "folders"));
    if(snap.empty){
      listEl.innerHTML = `<p class="sub">কোনো ফোল্ডার নেই।</p>`;
      return;
    }
    listEl.innerHTML = "";
    snap.forEach(d=>{
      const f = d.data();
      const row = document.createElement("div");
      row.className = "folder-item";
      row.innerHTML = `<div>${f.label || d.id}</div><button class="del" data-id="${d.id}">মুছুন</button>`;
      listEl.appendChild(row);
    });
    listEl.querySelectorAll(".del").forEach(btn=>{
      btn.onclick = async ()=>{
        try{ await deleteDoc(doc(db, "folders", btn.dataset.id)); loadFolderList(); }catch(e){}
      };
    });
  }catch(e){
    listEl.innerHTML = `<p class="sub">ফোল্ডার লোড করা যায়নি।</p>`;
  }
}

async function addFolder(){
  const label = document.getElementById("newLabel").value.trim();
  const pw = document.getElementById("newPw").value.trim();
  const link = document.getElementById("newLink").value.trim();
  const msgEl = document.getElementById("addMsg");
  if(!label || !pw || !link){ msgEl.className="msg err"; msgEl.textContent="সবগুলো ঘর পূরণ করুন।"; return; }
  try{
    const hash = await sha256(pw);
    const slug = "f" + Date.now();
    await setDoc(doc(db, "folders", slug), { label, passHash: hash, link });
    msgEl.className="msg ok"; msgEl.textContent="যোগ হয়েছে!";
    document.getElementById("newLabel").value="";
    document.getElementById("newPw").value="";
    document.getElementById("newLink").value="";
    loadFolderList();
  }catch(e){
    msgEl.className="msg err"; msgEl.textContent="যোগ করা যায়নি।";
  }
}

renderMain();

// ---- ম্যাট্রিক্স ব্যাকগ্রাউন্ড অ্যানিমেশন ----
(function(){
  const canvas = document.getElementById("matrix");
  const ctx = canvas.getContext("2d");
  let w, h, cols, drops;
  const chars = "01アイウエオカキクケコサシスセソタチツテト".split("");

  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    cols = Math.floor(w / 16);
    drops = new Array(cols).fill(1);
  }
  window.addEventListener("resize", resize);
  resize();

  function draw(){
    ctx.fillStyle = "rgba(2,6,10,0.08)";
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = "#00ff9d";
    ctx.font = "14px monospace";
    for(let i=0; i<drops.length; i++){
      const text = chars[Math.floor(Math.random()*chars.length)];
      ctx.fillText(text, i*16, drops[i]*16);
      if(drops[i]*16 > h && Math.random() > 0.975){ drops[i] = 0; }
      drops[i]++;
    }
  }
  setInterval(draw, 50);
})();
</script>
</body>
</html>
